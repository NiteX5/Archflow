      status: verified
      verifiedRevision: 73de52d

  - id: watcher-module-l2n8
    kind: module
    name: File watcher
    parent: node-runtime-d3v7
    responsibility: Debounced fs.watch on .archflow/ (polling fallback) that triggers reloads.
    code:
      - path: src/node/watch.ts
        symbol: watchModel
    provenance:
      source: agent
      status: verified
      verifiedRevision: 73de52d

  - id: importer-module-f8w2
    kind: module
    name: Importer
    parent: node-runtime-d3v7
