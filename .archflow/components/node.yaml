    code:
      - path: src/node/workspace.ts
        symbol: Workspace
    provenance:
      source: agent
      status: verified
      verifiedRevision: 73de52d

  - id: writer-module-s9w4
    kind: module
    name: Model writer
    parent: node-runtime-d3v7
