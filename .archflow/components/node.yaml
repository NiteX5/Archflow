    code:
      - path: src/node/importer.ts
        symbol: planImport
      - path: src/node/drawio-import.ts
        symbol: parseDrawio
    provenance:
      source: agent
      status: verified
      verifiedRevision: 70c2c16

  - id: verify-module-u3k7
    kind: module
    name: Verifier
    parent: node-runtime-d3v7
    responsibility: Reports discrepancies between the model and the repository (code references, TS/JS imports, SQL, Compose, Terraform); never edits the model.
    code:
      - path: src/node/verify.ts
        symbol: verifyModel
    provenance:
      source: agent
      status: verified
      verifiedRevision: 70c2c16

  - id: skill-installer-c2n9
    kind: module
    name: Skill installer and init
    parent: node-runtime-d3v7
    code:
      - path: src/node/skill.ts
        symbol: installSkill
      - path: src/node/init.ts
        symbol: initModel
    provenance:
      source: agent
      status: verified
      verifiedRevision: 70c2c16

