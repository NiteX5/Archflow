elements:
  - id: node-runtime-d3v7
    kind: library
    name: Node runtime layer
    responsibility: Filesystem access confined to the authorized repository, workspace state, writes, history and watching.
    code:
      - path: src/node
    provenance:
      source: agent
      status: verified
      verifiedRevision: 73de52d

  - id: repo-access-y5b2
    kind: module
    name: Repository access
