elements:
  - id: core-library-n5w1
    kind: library
    name: Core library
    responsibility: Isomorphic model schema, validation, view derivation and layout shared by the CLI, service and UI.
    code:
      - path: src/core
    rules:
      - Must not import Node APIs, so the browser can use it.
    provenance:
      source: agent
      status: verified
      evidence:
        - description: Header comment of the schema module
          ref: src/core/schema.ts
      verifiedRevision: 73de52d

  - id: schema-module-t6a3
    kind: module
    name: Schema v1
    parent: core-library-n5w1
    code:
      - path: src/core/schema.ts
    provenance:
      source: agent
      status: verified
      verifiedRevision: 73de52d

  - id: validator-module-m2q8
    kind: module
    name: Validator
    parent: core-library-n5w1
    responsibility: Atomic structural and referential validation with located issues.
    code:
      - path: src/core/validate.ts
        symbol: validateModel
    rules:
      - A model with any error is never returned, so callers keep the last valid version.
    provenance:
      source: agent
      status: verified
      verifiedRevision: 73de52d

  - id: views-module-g7c5
    kind: module
    name: Views and layout
    parent: core-library-n5w1
    responsibility: Derives every view from the same model and lays it out; saved positions win.
    code:
      - path: src/core/views.ts
        symbol: deriveView
      - path: src/core/layout.ts
        symbol: layoutView
    provenance:
      source: agent
      status: verified
      verifiedRevision: 73de52d

  - id: interchange-module-p9r5
    kind: module
    name: Interchange and rendering
    parent: core-library-n5w1
    responsibility: Native bundle, Mermaid import/export, draw.io export, SVG and PDF rendering of views.
    code:
      - path: src/core/interchange.ts
        symbol: toBundle
      - path: src/core/mermaid.ts
        symbol: parseMermaid
      - path: src/core/drawio.ts
        symbol: viewToDrawio
      - path: src/core/render.ts
        symbol: sceneToPdf
    provenance:
      source: agent
      status: verified
      verifiedRevision: 70c2c16

